<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canvas picker basics</title>
  <style>
    body { max-width: 600px; margin: 32px auto; padding: 0 16px; font: 16px/1.5 system-ui, sans-serif; color: #1b2228; background: #f5f6f4; }
    h1 { font-size: 24px; }
    h2 { margin-bottom: 8px; font-size: 18px; }
    section { margin-top: 28px; }
    canvas { display: block; border: 1px solid #ccd3ce; background: white; touch-action: none; }
    output { display: block; margin-top: 8px; font: 14px/1.5 ui-monospace, monospace; }
    button { margin-top: 8px; padding: 4px 8px; font: inherit; }
  </style>
</head>
<body>
  <h1>Canvas picker basics</h1>
  <p>Each example draws the same two shapes. Click either shape or the empty space.</p>
  <section>
    <h2>1. Read a numeric index</h2>
    <canvas id="indices" aria-label="Rectangle and circle picked by numeric index"></canvas>
    <output id="indices-result"></output>
  </section>
  <section>
    <h2>2. Give shapes string IDs</h2>
    <canvas id="ids" aria-label="Rectangle and circle picked by string ID"></canvas>
    <output id="ids-result"></output>
  </section>
  <section>
    <h2>3. Listen for pointer events</h2>
    <canvas id="events" aria-label="Hover and click the rectangle or circle"></canvas>
    <output id="events-result">Hover or click a shape.</output>
    <button id="stop-events">Stop tracking</button>
  </section>
  <script type="module" src="./basic.ts"></script>
</body>
</html>
